<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inauguration Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; height: 100%; background: #000; overflow: hidden; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    #wrapper { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }
    video, img { width: 100vw; height: 100vh; object-fit: cover; position: absolute; top: 0; left: 0; }
    .hidden { display: none !important; }

    /* Website iframe — pre-loaded in background while video plays */
    #site-wrap {
      display: block;          /* stay in DOM so browser loads it */
      visibility: hidden;      /* invisible until revealed */
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 30;
      opacity: 0;
      transition: opacity 1.2s ease;
      background: #000;
      pointer-events: none;
    }
    #site-wrap.visible {
      visibility: visible;
      opacity: 1;
    }
    #site-wrap.interact {
      pointer-events: auto;
      cursor: auto;
    }
    
    #site-frame {
      display: block;
      width: 1920px;
      height: 1080px;
      border: none;
      transform-origin: top left;
      pointer-events: none;
    }
    #site-frame.interact {
      pointer-events: auto;
    }

    /* Status bar */
    #bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); color: #9ab; font: 600 12px/1.6 sans-serif; text-transform: uppercase; letter-spacing: 1px; text-align: center; padding: 10px 12px; z-index: 10; transition: opacity .6s; border-top: 1px solid rgba(255,255,255,0.1); }
    #bar.ok { color: #6fd6a4; text-shadow: 0 0 10px rgba(111,214,164,0.3); }
    #bar.gone { opacity: 0; pointer-events: none; }

    /* Minimal Overlay */
    #overlay { 
      position: fixed; inset: 0; 
      background: #000;
      display: flex; align-items: center; justify-content: center; 
      z-index: 100; cursor: pointer; 
    }
    #overlay .text { 
      color: #fff; 
      font-size: 24px; 
      font-weight: 400; 
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.8;
    }
    #overlay.hidden { display: none !important; }

    /* Celebration canvas */
    #celebrate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 80;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <video id="video" playsinline preload="auto"></video>
    <img id="img" class="hidden" src="2.jpg.jpeg" alt="" />
  </div>

  <!-- Background Music Loop -->
  <audio id="bgMusic" src="NASTY! (Sped Up).mp3" preload="auto" loop></audio>

  <div id="site-wrap">
    <iframe id="site-frame" src="" scrolling="no" allowfullscreen></iframe>
  </div>

  <canvas id="celebrate"></canvas>

  <div id="overlay">
    <div class="text">Click to Setup Display</div>
  </div>
  <div id="bar">System Booting...</div>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
    /* ── Config ────────────────────────────────────────────────────── */
    var VIDEO_URL      = "https://res.cloudinary.com/dzazecta2/video/upload/v1776484458/Video_Project_4_udqsvs.mp4";
    var BROKER         = "wss://broker.hivemq.com:8884/mqtt";
    var TOPIC          = "spandan/inauguration/ctrl";
    var STATUS_TOPIC   = "spandan/inauguration/display_status";  // display → remote
    var SITE_URL       = "https://lava-mh.com";
    var DESKTOP_W      = 1920;
    var CELEBRATE_TIME = 6000;

    /* ── Elements ──────────────────────────────────────────────────── */
    var video     = document.getElementById("video");
    var img       = document.getElementById("img");
    var bar       = document.getElementById("bar");
    var overlay   = document.getElementById("overlay");
    var canvas    = document.getElementById("celebrate");
    var siteWrap  = document.getElementById("site-wrap");
    var siteFrame = document.getElementById("site-frame");
    var bgMusic   = document.getElementById("bgMusic");
    var ctx       = canvas.getContext("2d");

    // Set initial source immediately for streaming fallback
    video.src = VIDEO_URL;

    function status(t, ok) { 
      bar.textContent = t; 
      bar.className = ok ? "ok" : ""; 
      bar.classList.remove("gone"); 
      console.log("Status:", t);
    }
    function hideBar() { bar.classList.add("gone"); }

    /* ── Audio Fade Logic ─────────────────────────────────────────── */
    function fadeOutMusic(durationMs) {
      if (!bgMusic) return;
      var startVol = bgMusic.volume;
      if (startVol === 0) return;
      var interval = 50; 
      var step = startVol / (durationMs / interval);
      var fade = setInterval(function() {
        if (bgMusic.volume > step) {
          bgMusic.volume -= step;
        } else {
          bgMusic.volume = 0;
          bgMusic.pause();
          clearInterval(fade);
        }
      }, interval);
    }

    /* ── Desktop Scaling Logic ─────────────────────────────────────── */
    function applyDesktopScale() {
      var scale = window.innerWidth / DESKTOP_W;
      siteFrame.style.transform = 'scale(' + scale + ')';
      siteFrame.style.height = (window.innerHeight / scale) + "px";
    }
    window.addEventListener("resize", applyDesktopScale);

    /* ── Celebration Logic ─────────────────────────────────────────── */
    var particles   = [];
    var animRAF     = null;
    var canvasAlpha = 1;      // master opacity for the whole canvas
    var isFadingOut = false;
    var FADE_SPEED  = 0.004;  // reduce by this much each frame (~3 s at 60 fps)
    var COLORS = ["#ff0080","#ff6b00","#ffd700","#00e676","#00b0ff","#d500f9","#ffffff","#ff4444"];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);

    function burst(x, y) {
      var count = 100 + Math.random() * 50 | 0;
      for (var i = 0; i < count; i++) {
        var angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
        var speed = 4 + Math.random() * 10;
        particles.push({
          x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          alpha: 1, size: 2 + Math.random() * 4, color: COLORS[Math.random() * COLORS.length | 0],
          type: "spark", decay: 0.004 + Math.random() * 0.004  // slower sparkle decay
        });
      }
    }

    function spawnConfetti() {
      for (var i = 0; i < 8; i++) {
        particles.push({
          x: Math.random() * canvas.width, y: -20, vx: (Math.random() - 0.5) * 4, vy: 3 + Math.random() * 5,
          alpha: 1, size: 8 + Math.random() * 12, color: COLORS[Math.random() * COLORS.length | 0],
          type: "confetti", rot: Math.random() * Math.PI * 2, rotV: (Math.random() - 0.5) * 0.25, decay: 0.0015
        });
      }
    }

    function celebrateLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Gradually lower master opacity during fadeout
      if (isFadingOut) {
        canvasAlpha = Math.max(0, canvasAlpha - FADE_SPEED);
      }

      // Slow down individual particle decay during fadeout so canvas alpha drives the fade
      var decayMul = isFadingOut ? 0.15 : 1;

      for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx; p.y += p.vy; p.alpha -= p.decay * decayMul;
        if (p.type === "spark") {
          p.vy += 0.2;
          ctx.globalAlpha = Math.max(0, p.alpha) * canvasAlpha;
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        } else {
          p.rot += p.rotV; p.vy += 0.02;
          ctx.globalAlpha = Math.max(0, p.alpha) * canvasAlpha;
          ctx.save();
          ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
          ctx.restore();
        }
        if (p.alpha <= 0 || p.y > canvas.height + 50) particles.splice(i, 1);
      }

      if (isFadingOut && canvasAlpha <= 0) {
        // Fully faded — stop loop and hide canvas
        canvas.style.display = "none";
        animRAF = null;
        return;
      }

      animRAF = requestAnimationFrame(celebrateLoop);
    }

    function startCelebration() {
      resizeCanvas();
      isFadingOut = false;
      canvasAlpha = 1;
      canvas.style.display = "block";
      var fTimer = setInterval(function() {
        burst(canvas.width * (0.1 + Math.random() * 0.8), canvas.height * (0.1 + Math.random() * 0.4));
      }, 600);
      var cTimer = setInterval(spawnConfetti, 100);
      celebrateLoop();

      setTimeout(function() {
        clearInterval(fTimer);
        clearInterval(cTimer);

        // Begin JS-driven fade — allows website interaction immediately
        isFadingOut = true;

        siteFrame.setAttribute("scrolling", "yes");
        siteFrame.classList.add("interact");
        siteWrap.classList.add("interact");
        document.body.style.cursor = "auto";

        // Music fades out after 2 more seconds
        setTimeout(function() { fadeOutMusic(2000); }, 2000);
      }, CELEBRATE_TIME);
    }

    /* ── Flow Logic ────────────────────────────────────────────────────── */
    function playVideo() {
      // Hide site but keep it loaded in background (don't reset src)
      siteWrap.classList.remove("visible", "interact");
      siteWrap.style.visibility = "hidden";
      siteWrap.style.opacity = "0";
      siteWrap.style.pointerEvents = "none";
      siteFrame.classList.remove("interact");
      document.body.style.cursor = "none";

      img.classList.add("hidden");
      video.classList.remove("hidden");
      video.currentTime = 0;
      video.play().then(function() {
        hideBar();
      }).catch(function(e) { 
        status("Tap screen to allow video play."); 
      });
    }

    video.addEventListener("ended", function () {
      video.classList.add("hidden");
      // Site is already pre-loaded — clear inline overrides and reveal via CSS class
      applyDesktopScale();
      siteWrap.style.visibility = "";
      siteWrap.style.opacity = "";
      siteWrap.style.pointerEvents = "";
      siteWrap.classList.add("visible");
      startCelebration();
    });

    /* ── Preload Logic ─────────────────────────────────────────────── */
    function preloadVideo() {
      status("Optimizing experience...");
      fetch(VIDEO_URL).then(function(response) {
        if (!response.ok) throw new Error();
        return response.blob();
      }).then(function(blob) {
        var url = URL.createObjectURL(blob);
        video.src = url;
        status("System Ready.", true);
        setTimeout(hideBar, 3000);
      }).catch(function(e) {
        video.src = VIDEO_URL;
        status("System Ready.", true);
        setTimeout(hideBar, 2000);
      });
    }

    /* ── Arming Logic ──────────────────────────────────────────────── */
    var armed = false;
    var heartbeatInterval = null;

    function publishDisplayStatus(state) {
      if (displayClient && displayClient.connected) {
        displayClient.publish(
          STATUS_TOPIC,
          JSON.stringify({ state: state, at: Date.now() }),
          { qos: 1, retain: true }
        );
      }
    }

    function startHeartbeat() {
      if (heartbeatInterval) clearInterval(heartbeatInterval);
      // Publish current state every 1 second for near-instant remote updates
      heartbeatInterval = setInterval(function() {
        publishDisplayStatus(armed ? "ready" : "booting");
      }, 1000);
    }

    function arm() {
      if (armed) return;
      armed = true;
      overlay.classList.add("hidden");
      try { goFS(); } catch(e) {}

      bgMusic.volume = 1.0;
      bgMusic.load();

      // Pre-load the website NOW in background while video plays — zero lag at reveal
      applyDesktopScale();
      siteFrame.src = SITE_URL;

      video.muted = true;
      video.play().then(function() {
        video.pause(); video.currentTime = 0; video.muted = false;
        preloadVideo();
        publishDisplayStatus("ready");
      }).catch(function() {
        video.muted = false;
        preloadVideo();
        publishDisplayStatus("ready");
      });
    }
    overlay.addEventListener("click", arm);
    document.addEventListener("click", arm);

    function goFS() {
      var el = document.documentElement;
      try {
        if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } catch(e) {}
    }

    /* ── MQTT ──────────────────────────────────────────────────────── */
    if (typeof mqtt !== "undefined") {
      var displayClient = mqtt.connect(BROKER, { clean: true, reconnectPeriod: 2000, clientId: "player_" + Math.random().toString(16).slice(2, 8) });
      displayClient.on("connect", function () {
        // Immediately overwrite any stale retained "ready" with fresh "booting"
        displayClient.publish(STATUS_TOPIC, JSON.stringify({ state: "booting", at: Date.now() }), { qos: 1, retain: true });
        displayClient.subscribe(TOPIC, function (err) { 
          if (!err && armed) status("System Ready.", true);
        });
        startHeartbeat();
      });
      displayClient.on("message", function (t, p) {
        try { 
          var d = JSON.parse(p.toString()); 
          if (d.cmd === "play") { 
            if (!armed) {
              console.warn("Received play command but display is not armed.");
              return;
            }
            if (animRAF) cancelAnimationFrame(animRAF);
            particles = [];
            goFS(); 
            playVideo();
            bgMusic.currentTime = 0;
            bgMusic.volume = 1.0;
            bgMusic.play().catch(function(e){ console.log("Audio play failed:", e); });
          } 
        } catch(e) {}
      });
      displayClient.on("reconnect", function () { 
        status("Reconnecting...");
        if (heartbeatInterval) clearInterval(heartbeatInterval);
      });
      displayClient.on("offline", function() {
        if (heartbeatInterval) clearInterval(heartbeatInterval);
      });
    } else {
      console.error("MQTT library not loaded");
      status("Library Error. Check Internet.");
    }
  </script>
</body>
</html>
